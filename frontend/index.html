<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Legacy Code Whisperer — a safety-first workflow that modernizes legacy repositories with IBM Bob: assess risk, protect behaviour, change in small steps, verify, and roll back on regression."
    />
    <title>Legacy Code Whisperer</title>
    <script>
      // Resolve the theme before first paint so dark mode never flashes light.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("lcw-theme");
        } catch (err) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
