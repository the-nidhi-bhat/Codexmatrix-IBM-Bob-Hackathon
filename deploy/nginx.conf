# nginx configuration for Legacy Code Whisperer
# Single VM deployment: serves frontend static files and proxies /api/* to backend
#
# Deployment notes:
# - This file is a template. Secrets must be provided at deployment time.
# - Copy to /etc/nginx/sites-available/legacy-code-whisperer
# - Symlink to /etc/nginx/sites-enabled/
# - Test with: nginx -t
# - Reload with: systemctl reload nginx

# Upstream backend server
upstream backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with actual domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # Replace with actual domain

    # SSL certificates (Let's Encrypt paths shown; update after certbot obtains cert)
    # After certbot runs: certbot --nginx -d your-domain.example
    # Certificates will be at /etc/letsencrypt/live/your-domain.example/
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (enable after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Root for frontend static files
    root /opt/legacy-code-whisperer/frontend/dist;
    index index.html;

    # Client body limit (match backend 1MB JSON limit + margin)
    client_max_body_size 2M;

    # ============================================================
    # STATIC FRONTEND
    # ============================================================
    location / {
        # Try to serve file directly, fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (hashed filenames from Vite)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # No cache for index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ============================================================
    # API PROXY
    # ============================================================
    location /api/ {
        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ============================================================
        # SERVER-SIDE AUTH INJECTION
        # ============================================================
        # The API_AUTH_TOKEN is a server secret. It is NEVER sent to the browser.
        # nginx injects it here from an environment variable or included file.
        # The placeholder {{API_AUTH_TOKEN}} must be replaced at deployment time.
        # Example: include /etc/nginx/auth_token.conf; (with "proxy_set_header Authorization \"Bearer actual-token\";")
        # DO NOT hardcode the token in this file.
        # ============================================================
        include /etc/nginx/auth_token.conf;

        # ============================================================
        # TIMEOUT CONFIGURATION
        # ============================================================
        # Checkpoint verification can take up to ~15 minutes (Docker validation × 2).
        # These timeouts MUST be long enough to accommodate the longest operation.
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;     # 15 minutes
        proxy_read_timeout 900s;     # 15 minutes
        send_timeout 900s;

        # Buffering: disable for long-running requests to stream responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # WebSocket support (not currently used, but harmless)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # HEALTH ENDPOINT (public, no auth injection)
    # ============================================================
    location = /api/health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No auth injection for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ============================================================
    # SECURITY: DENY ACCESS TO SENSITIVE FILES
    # ============================================================
    location ~* /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|gitignore|gitattributes)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(deploy|backend|tools|legacy|validation|IBM_BOB|bob_sessions|ASSESS\.md|PLAN\.md|LICENSE)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # LOGGING
    # ============================================================
    access_log /var/log/nginx/legacy-code-whisperer-access.log combined;
    error_log /var/log/nginx/legacy-code-whisperer-error.log warn;

    # Do NOT log Authorization header
    log_format combined_no_auth '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/legacy-code-whisperer-access.log combined_no_auth;
}